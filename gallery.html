<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | City Club Mandya</title>

    <meta name="description" content="Browse photos of City Club Mandya's grounds, dining hall, indoor games room, sports courts, banquet hall and clubhouse events in our full member gallery.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Gallery | City Club Mandya">
    <meta property="og:description" content="Browse photos of City Club Mandya's grounds, dining hall, indoor games room, sports courts, banquet hall and clubhouse events in our full member gallery.">
    <meta property="og:image" content="images/og-image.png">
    <meta property="og:url" content="https://www.cityclubmandya.com/gallery.html">
    <meta property="og:site_name" content="City Club Mandya">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gallery | City Club Mandya">
    <meta name="twitter:description" content="Browse photos of City Club Mandya's grounds, dining hall, indoor games room, sports courts, banquet hall and clubhouse events in our full member gallery.">
    <meta name="twitter:image" content="images/og-image.png">

    <!-- Preload critical assets -->
    <link rel="preload" href="images/logo.png" as="image">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="preload" as="style" href="css/style.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/png" sizes="256x256" href="images/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png" />

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>

<body data-page="gallery">

    <!-- Header + mobile nav are injected by js/partials.js -->
    <div id="site-header"></div>

    <!-- =====================================================
                        HERO (STATIC IMAGE)
    ====================================================== -->

    <section class="hero hero-static">

        <img src="images/hero1.jpeg"
             width="2000" height="1338"
             alt="City Club Mandya — clubhouse exterior view"
             class="hero-static-img"
             loading="lazy">

        <div class="hero-overlay"></div>

    </section>

    <!-- =====================================================
                    CLUB NAME BANNER
    ====================================================== -->

    <section class="club-banner">

        <h1 class="club-title">

            CITY CLUB MANDYA

        </h1>

    </section>

    <!-- =====================================================
                    FULL GALLERY
    ====================================================== -->

    <section class="gallery-page">

        <div class="container">

            <div class="section-title">

                <h2>Our Gallery</h2>

            </div>

            <div class="full-gallery-grid">

                <div class="gallery-item" data-caption="Clubhouse Grounds — a wide view of the manicured lawns and outdoor gathering spaces.">

                    <img src="images/gallery1.jpeg"
                         srcset="images/gallery1.jpeg 300w, images/gallery1.jpeg 600w, images/gallery1.jpeg 900w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Clubhouse Grounds"
                         loading="lazy">
                    <span class="gallery-label">Celebrations</span>

                </div>

                <div class="gallery-item" data-caption="Dining Hall — elegant seating where members and guests enjoy fine meals together.">

                    <img src="images/gallery2.jpeg"
                         srcset="images/gallery2.jpeg 300w, images/gallery2.jpeg 600w, images/gallery2.jpeg 900w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Dining Hall"
                         loading="lazy">
                    <span class="gallery-label">Grounds</span>

                </div>

                <div class="gallery-item" data-caption="Indoor Games Room — a lively space for billiards, cards and indoor recreation.">

                    <img src="images/gallery3.jpeg"
                         srcset="images/gallery3.jpeg 300w, images/gallery3.jpeg 600w, images/gallery3.jpeg 900w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Indoor Games Room"
                         loading="lazy">
                    <span class="gallery-label">Grounds</span>

                </div>

                <div class="gallery-item" data-caption="Banquet Hall — the venue for weddings, celebrations and large member gatherings.">

                    <img src="images/gallery4.jpeg"
                         srcset="images/gallery4.jpeg 300w, images/gallery4.jpeg 600w, images/gallery4.jpeg 900w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Banquet Hall"
                         loading="lazy">
                    <span class="gallery-label">Entrance</span>

                </div>

                <div class="gallery-item" data-caption="Sports Courts — dedicated courts where members enjoy friendly matches and tournaments.">

                    <img src="images/gallery5.jpeg"
                         srcset="images/gallery5.jpeg 300w, images/gallery5.jpeg 600w, images/gallery5.jpeg 900w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Sports Courts"
                         loading="lazy">
                    <span class="gallery-label">Swimming</span>

                </div>

                <div class="gallery-item" data-caption="Swimming Pool — a refreshing space for recreation and family time.">

                    <img src="images/gallery6.jpeg"
                         srcset="images/gallery6.jpeg 300w, images/gallery6.jpeg 600w, images/gallery6.jpeg 900w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Swimming Pool"
                         loading="lazy">
                    <span class="gallery-label">Sports</span>

                </div>

                <div class="gallery-item" data-caption="Main Entrance — the grand façade welcoming members and guests to City Club Mandya.">

                    <img src="images/hero1.jpeg"
                         srcset="images/hero1.jpeg 300w, images/hero1.jpeg 700w, images/hero1.jpeg 2000w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Main Entrance"
                         loading="lazy">
                    <span class="gallery-label">Banquet</span>

                </div>

                <div class="gallery-item" data-caption="Evening Ambience — the clubhouse lit up for an evening event.">

                    <img src="images/hero2.jpeg"
                         srcset="images/hero2.jpeg 300w, images/hero2.jpeg 700w, images/hero2.jpeg 2000w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Evening Ambience"
                         loading="lazy">
                    <span class="gallery-label">Games</span>

                </div>

                <div class="gallery-item" data-caption="Club Celebrations — members coming together for a festive club occasion.">

                    <img src="images/hero3.png"
                         srcset="images/hero3.png 300w, images/hero3.png 700w, images/hero3.png 2000w"
                         sizes="(max-width:600px) 100vw, (max-width:1024px) 50vw, 33vw"
                         width="300" height="300"
                         alt="City Club Mandya — Club Celebrations"
                         loading="lazy">
                    <span class="gallery-label">Dining</span>

                </div>

            </div>

        </div>

    </section>

    <!-- =====================================================
                    GALLERY LIGHTBOX
    ====================================================== -->

    <div class="lightbox" id="lightbox">

        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>

        <div class="lightbox-content">

            <img src="" alt="" id="lightbox-img">

            <p class="lightbox-caption" id="lightbox-caption"></p>

        </div>

    </div>

    <!-- Footer is injected by js/partials.js -->
    <div id="site-footer"></div>

    <!-- WhatsApp click-to-chat button, injected by js/partials.js -->
    <!-- <div id="site-whatsapp"></div> -->

    <script src="js/partials.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
